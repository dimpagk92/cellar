name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# ---------------------------------------------------------------------------
# Change detection — skip jobs when their source files haven't changed
# ---------------------------------------------------------------------------
jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      ts: ${{ steps.filter.outputs.ts }}
      napi: ${{ steps.filter.outputs.napi }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - 'cel/**'
              - 'adapters/adapter-common/**'
              - 'adapters/excel/**'
              - 'adapters/sap-gui/**'
              - 'adapters/bloomberg/**'
              - 'adapters/metatrader/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
            ts:
              - 'agent/**'
              - 'mcp-server/**'
              - 'cli/**'
              - 'adapters/browser/**'
              - 'live-view/**'
              - 'recorder/**'
              - 'registry/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.base.json'
              - '.github/workflows/ci.yml'
            napi:
              - 'cel/cel-napi/**'
              - 'cel/cel-cortex/**'
              - 'cel/cel-context/**'
              - 'cel/cel-contracts/**'
              - 'cel/cel-planner/**'
              - 'cel/cel-goal-runner/**'
              - 'cel/cel-store/**'
              - 'cel/cel-cdp/**'
              - 'cel/cel-signals/**'
              - 'tests/cortex/**'
              - '.github/workflows/ci.yml'

  # -------------------------------------------------------------------------
  # Rust — format (fast-fail), clippy, tests on Linux + macOS
  # -------------------------------------------------------------------------
  rust-fmt:
    name: 'Rust: format'
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: make lint-rust-fmt

  rust-clippy:
    name: 'Rust: clippy (${{ matrix.os }})'
    needs: [changes, rust-fmt]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
          - os: macos
            runner: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install system deps (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev at-spi2-core \
            libwayland-dev libpipewire-0.3-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libasound2-dev libgbm-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy-${{ matrix.os }}

      - run: make lint-rust-clippy

  rust-test:
    name: 'Rust: test (${{ matrix.os }})'
    needs: [changes, rust-fmt]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
          - os: macos
            runner: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install system deps (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev at-spi2-core \
            libwayland-dev libpipewire-0.3-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libasound2-dev libgbm-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-${{ matrix.os }}

      - run: make test-rust

  # -------------------------------------------------------------------------
  # TypeScript — build, typecheck, unit tests (Linux only; no platform code)
  # -------------------------------------------------------------------------
  ts-build:
    name: 'TS: build + lint'
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - run: make build-ts
      - run: make lint-ts

  ts-test:
    name: 'TS: unit tests'
    needs: [changes, ts-build]
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - run: make build-ts
      - run: make test-ts

  # -------------------------------------------------------------------------
  # Cortex + NAPI — integration tests (macOS only; needs accessibility APIs)
  # -------------------------------------------------------------------------
  cortex:
    name: 'Cortex: integration (macOS)'
    needs: changes
    if: needs.changes.outputs.napi == 'true'
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cortex-macos

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - run: make test-cortex
      - run: make build-napi
      - run: make build-ts
      - run: make test-cortex-napi
      - run: make test-cortex-mcp

  # -------------------------------------------------------------------------
  # Gate — single required status check for branch protection
  # -------------------------------------------------------------------------
  ci-ok:
    name: CI ✓
    if: always()
    needs: [rust-fmt, rust-clippy, rust-test, ts-build, ts-test, cortex]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all jobs passed
        run: |
          results=(
            "${{ needs.rust-fmt.result }}"
            "${{ needs.rust-clippy.result }}"
            "${{ needs.rust-test.result }}"
            "${{ needs.ts-build.result }}"
            "${{ needs.ts-test.result }}"
            "${{ needs.cortex.result }}"
          )
          for r in "${results[@]}"; do
            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              echo "::error::Required check failed or was cancelled ($r)"
              exit 1
            fi
          done
          echo "All required checks passed (or were skipped due to path filtering)"
