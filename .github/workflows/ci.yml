name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust-check:
    name: Rust ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
          components: clippy, rustfmt

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check workspace
        run: cargo check --workspace

      - name: Run tests
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Format check
        run: cargo fmt --all -- --check

  typescript-check:
    name: TypeScript ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint
        continue-on-error: true

  rust-linux:
    name: Rust Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev at-spi2-core \
            libwayland-dev libpipewire-0.3-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Install Rust toolchain
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: linux-cargo-

      - name: Run tests
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

  napi-build:
    name: NAPI ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    needs: [rust-check, typescript-check]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build NAPI bindings
        run: cargo build -p cel-napi --release

      - name: Verify .node artifact
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            ls -la target/release/cel_napi.dll || echo "DLL not found (expected for napi)"
          else
            ls -la target/release/libcel_napi.dylib || echo "dylib not found (expected for napi)"
          fi

  cortex-tests:
    name: Cortex Tests
    runs-on: macos-latest
    needs: [rust-check]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-cortex-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: macos-cortex-

      - name: Rust Cortex unit tests (40 tests)
        run: cargo test -p cel-cortex

      - name: Build NAPI binary with Cortex
        run: |
          cargo build --release -p cel-napi
          cp target/release/libcel_napi.dylib cel/cel-napi/cel-napi.darwin-arm64.node

      - name: Build TypeScript
        run: pnpm install --frozen-lockfile && pnpm -r build

      - name: NAPI smoke test (28 tests)
        run: node tests/cortex/napi-smoke.mjs

      - name: MCP protocol test (14 tests)
        run: node tests/cortex/mcp-protocol.mjs
