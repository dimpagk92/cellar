name: Extraction readiness

# Lint guard for OSS-extraction-candidate crates. Enforces the
# cel-cortex / cel-memory / cel-memory-sqlite / cel-brief ownership split:
# none of these may reach back into the live-perception or brief-assembly core.
#
# Allowlist (use statements in src/, NOT including dev-deps in tests/):
#   cel-memory:            (none — zero cel-*/cellar-* imports)
#   cel-memory-sqlite:     cel_memory only
#   cel-brief:             cel_memory only (and only via the `memory` feature)
#
# In particular: cel-brief must not import cel_cortex; cel-memory and
# cel-memory-sqlite must not import cel_brief or cel_cortex.
#
# Required for PRs touching the extraction-candidate crates.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'cel/cel-memory/**'
      - 'cel/cel-memory-sqlite/**'
      - 'cel/cel-brief/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/extraction-readiness.yml'
      - 'scripts/lint-guard-extraction-crates.sh'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint-guard:
    name: No-reverse-deps lint guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install ripgrep
        run: sudo apt-get install -y ripgrep

      - name: Check cel-memory imports
        run: |
          echo "checking cel-memory ..."
          violations=$(rg "^use (cel_|cellar_)" cel/cel-memory/src/ 2>/dev/null || true)
          if [ -n "$violations" ]; then
            echo "::error::cel-memory must have zero cel-* and cellar-* imports"
            echo "$violations"
            exit 1
          fi
          echo "  ✓ clean"

      - name: Check cel-memory-sqlite imports
        run: |
          echo "checking cel-memory-sqlite ..."
          # Only cel_memory is allowed. The summarizer is injected via the
          # cel_memory::Summarizer trait, so no router / cellar_* dep is needed.
          violations=$(
            rg "^use (cel_|cellar_)" cel/cel-memory-sqlite/src/ 2>/dev/null \
            | grep -v ":use cel_memory" \
            || true
          )
          if [ -n "$violations" ]; then
            echo "::error::cel-memory-sqlite may only import from cel_memory (never cel_brief / cel_cortex)"
            echo "$violations"
            exit 1
          fi
          echo "  ✓ clean (only cel-memory allowed)"

      - name: Check cel-brief imports
        if: hashFiles('cel/cel-brief/Cargo.toml') != ''
        run: |
          echo "checking cel-brief ..."
          violations=$(
            rg "^use (cel_|cellar_)" cel/cel-brief/src/ 2>/dev/null \
            | grep -v ":use cel_memory" \
            || true
          )
          if [ -n "$violations" ]; then
            echo "::error::cel-brief may only import from cel_memory (behind the memory feature); never cel_cortex"
            echo "$violations"
            exit 1
          fi
          echo "  ✓ clean (only cel-memory allowed)"

  allowlist-guard:
    name: Cargo dependency allowlist (extraction-candidate crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Run scripts/lint-guard-extraction-crates.sh
        run: ./scripts/lint-guard-extraction-crates.sh

  standalone-build:
    name: Standalone builds (extraction-candidate crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build cel-memory standalone
        run: cargo build -p cel-memory

      - name: Build cel-memory-sqlite standalone
        run: cargo build -p cel-memory-sqlite

      - name: Build cel-brief standalone
        if: hashFiles('cel/cel-brief/Cargo.toml') != ''
        run: cargo build -p cel-brief

      - name: Run cel-memory basic example
        run: cargo run -p cel-memory --example basic

      - name: Run cel-memory-sqlite basic example
        if: hashFiles('cel/cel-memory-sqlite/examples/basic.rs') != ''
        run: cargo run -p cel-memory-sqlite --example basic
