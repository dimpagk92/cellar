name: Release (signed macOS)

# Builds a signed + notarized Cellar.app + Cellar.dmg on tag pushes.
#
# Required GitHub Actions secrets:
#   APPLE_CERTIFICATE_BASE64    base64-encoded .p12 cert + private key
#                               (`base64 -i Developer_ID_Application.p12`)
#   APPLE_CERTIFICATE_PASSWORD  password for the .p12 above
#   KEYCHAIN_PASSWORD           ephemeral password for the temporary keychain
#                               this workflow creates (any strong string)
#   DEVELOPER_ID                "Developer ID Application: Name (TEAMID)"
#   APPLE_API_KEY               App Store Connect API key id (e.g. "ABCDE12345")
#   APPLE_API_ISSUER            App Store Connect issuer id (UUID)
#   APPLE_API_KEY_P8_BASE64     base64-encoded .p8 file content for the API key
#   BUNDLE_ID                   (optional) defaults to com.cellar.cellar
#
# These secrets are wired through `scripts/build-signed-macos.sh` via env
# vars. See `docs/codesigning.md` for the operator runbook.
#
# Trigger:
#   - Tag push matching v*.*.*  (e.g. v0.1.0, v1.2.3-rc.1)
#   - Manual dispatch (for re-runs after a notarization rejection)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build from (branch, tag, or SHA)'
        required: false
        default: ''

permissions:
  contents: write
  id-token: write

jobs:
  build-signed-macos:
    name: Build signed + notarized macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: macos-latest
            target: aarch64-apple-darwin
          - arch: x86_64
            runner: macos-latest
            target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Install Rust toolchain (${{ matrix.target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-cargo-release-

      # ─── Import signing certificate ─────────────────────────────────────────
      #
      # We create an ephemeral keychain, import the .p12 into it, and
      # make it the default for `codesign` to find. The keychain is
      # discarded when the runner ages out — secrets never touch disk
      # in plaintext.

      - name: Import code-signing certificate
        env:
          APPLE_CERTIFICATE_BASE64:   ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD:          ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/cellar-signing.keychain-db"

          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain  -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain  -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" \
              -P "$APPLE_CERTIFICATE_PASSWORD" \
              -A -t cert -f pkcs12 \
              -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list \
              -S apple-tool:,apple:,codesign: \
              -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Sanity-check: confirm the identity is now visible to codesign.
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      # ─── Set up App Store Connect API key for notarytool ────────────────────
      #
      # We can't use `notarytool store-credentials` non-interactively, so
      # we pass the key path directly. The build script reads
      # $APPLE_API_KEY_PATH instead of $NOTARIZE_PROFILE when set.

      - name: Stage notarization API key
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          API_KEY_PATH="$RUNNER_TEMP/notarize-api-key.p8"
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$API_KEY_PATH"
          echo "APPLE_API_KEY_PATH=$API_KEY_PATH" >> "$GITHUB_ENV"

      # ─── Build, sign, notarize, staple ──────────────────────────────────────

      - name: Build + sign + notarize
        env:
          DEVELOPER_ID:     ${{ secrets.DEVELOPER_ID }}
          BUNDLE_ID:        ${{ secrets.BUNDLE_ID }}
          APPLE_API_KEY:    ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # APPLE_API_KEY_PATH is set in the previous step via $GITHUB_ENV.
          # NOTARIZE_PROFILE is unused in CI — we use the API-key triple.
          # Build script reads APPLE_SIGNING_IDENTITY from DEVELOPER_ID.
        run: |
          # Stub NOTARIZE_PROFILE so the script's env-var check passes;
          # notarytool itself uses the API-key triple via the script's
          # alternate auth path.
          export NOTARIZE_PROFILE="ci-stub-unused"
          bash scripts/build-signed-macos.sh

      # ─── Upload artifacts ───────────────────────────────────────────────────

      - name: Upload .dmg artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cellar-${{ matrix.arch }}-dmg
          path: target/release/bundle/dmg/*.dmg
          retention-days: 14

      - name: Upload .app bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cellar-${{ matrix.arch }}-app
          path: target/release/bundle/macos/*.app
          retention-days: 14

      # ─── Attach to GitHub Release ───────────────────────────────────────────

      - name: Attach signed .dmg to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/bundle/dmg/*.dmg
          fail_on_unmatched_files: true
          generate_release_notes: true

      # ─── Cleanup ────────────────────────────────────────────────────────────

      - name: Delete signing keychain
        if: always()
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/cellar-signing.keychain-db"
          if [[ -f "$KEYCHAIN_PATH" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/notarize-api-key.p8" || true
