name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  # ── Build NAPI binaries for all platforms ──────────────────────────────────
  build-napi:
    name: NAPI ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: cel-napi.darwin-arm64.node
          - target: x86_64-apple-darwin
            # macos-13 hosted runners are being retired by GitHub —
            # release #55 sat queued for 15+ min because no Intel-Mac
            # runner ever picked it up. Switching to macos-latest
            # (Apple Silicon) and cross-compiling via the existing
            # `target: x86_64-apple-darwin` works because the macOS
            # SDK ships the x86_64 linker by default; rustup pulls the
            # matching Rust target a step later.
            os: macos-latest
            artifact: cel-napi.darwin-x64.node
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: cel-napi.linux-x64-gnu.node
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            artifact: cel-napi.linux-arm64-gnu.node
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: cel-napi.win32-x64-msvc.node

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libdbus-1-dev at-spi2-core \
            libwayland-dev libpipewire-0.3-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libasound2-dev libgbm-dev

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build NAPI binary
        run: cargo build -p cel-napi --release --target ${{ matrix.target }}

      - name: Copy artifact (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          EXTENSION=$([ "$RUNNER_OS" == "macOS" ] && echo "dylib" || echo "so")
          cp target/${{ matrix.target }}/release/libcel_napi.${EXTENSION} \
             cel/cel-napi/${{ matrix.artifact }}

      - name: Copy artifact (Windows)
        if: runner.os == 'Windows'
        run: |
          copy target\${{ matrix.target }}\release\cel_napi.dll cel\cel-napi\${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: napi-${{ matrix.target }}
          path: cel/cel-napi/${{ matrix.artifact }}
          retention-days: 7

  # ── Semantic release ───────────────────────────────────────────────────────
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    needs: [build-napi]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download all NAPI artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: napi-*
          path: cel/cel-napi
          merge-multiple: true

      - name: Build mcp-server
        run: pnpm --filter @dpagk/cellar-mcp build

      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release
