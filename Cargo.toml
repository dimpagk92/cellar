[workspace]
resolver = "2"
members = [
    "cel/cel-display",
    "cel/cel-input",
    "cel/cel-accessibility",
    "cel/cel-audio",
    "cel/cel-llm",
    "cel/cel-vision",
    "cel/cel-network",
    "cel/cel-context",
    "cel/cel-contracts",
    "cel/cel-store",
    "cel/cel-planner",
    "cel/cel-cdp",
    "cel/cel-signals",
    "cel/cel-cortex",
    "cel/cel-goal-runner",
    "cel/cel-memory",
    "cel/cel-memory-sqlite",
    "cel/cel-brief",
    "cel/cel-napi",
    "cellar-worker",
    "cellar-types",
    "cellar-llm-router",
    "cellar-webhook",
    "cellar-rule-compiler",
    "cellar-rules-store",
    "cellar-cli",
    "cel-cortex-daemon",
    "cel-act-gateway",
    "cellar-ipc",
    "adapters/adapter-common",
    "adapters/browser-rs",
    "adapters/calendar",
    "adapters/cel-adapter-runtime",
    "adapters/mail",
    "adapters/messages",
    "adapters/notes",
    "adapters/numbers",
    "adapters/reminders",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/dimpagk92/cellar"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
image = "0.25"
rusqlite = { version = "0.31", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json"] }
thiserror = "2"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v7", "serde"] }
anyhow = "1"
futures-util = "0.3"

# CEL internal crates
cel-llm = { path = "cel/cel-llm" }
cel-display = { path = "cel/cel-display" }
cel-input = { path = "cel/cel-input" }
cel-accessibility = { path = "cel/cel-accessibility" }
cel-audio = { path = "cel/cel-audio" }
cel-vision = { path = "cel/cel-vision" }
cel-network = { path = "cel/cel-network" }
cel-context = { path = "cel/cel-context" }
cel-contracts = { path = "cel/cel-contracts" }
cel-store = { path = "cel/cel-store" }
cel-planner = { path = "cel/cel-planner" }
cel-cortex = { path = "cel/cel-cortex" }
cel-goal-runner = { path = "cel/cel-goal-runner" }
cel-cdp = { path = "cel/cel-cdp" }
cel-memory = { path = "cel/cel-memory" }
cel-memory-sqlite = { path = "cel/cel-memory-sqlite" }
cel-signals = { path = "cel/cel-signals" }

# Cellar app crates (v1)
cellar-types = { path = "cellar-types" }
cellar-llm-router = { path = "cellar-llm-router" }
cellar-webhook = { path = "cellar-webhook" }
cellar-rule-compiler = { path = "cellar-rule-compiler" }
cellar-rules-store = { path = "cellar-rules-store" }
cel-cortex-daemon = { path = "cel-cortex-daemon" }
cel-act-gateway = { path = "cel-act-gateway" }
cellar-ipc = { path = "cellar-ipc" }
adapter-common = { path = "adapters/adapter-common" }
adapter-browser = { path = "adapters/browser-rs" }
adapter-calendar = { path = "adapters/calendar" }
adapter-mail = { path = "adapters/mail" }
adapter-messages = { path = "adapters/messages" }
adapter-notes = { path = "adapters/notes" }
adapter-numbers = { path = "adapters/numbers" }
adapter-reminders = { path = "adapters/reminders" }
cel-adapter-runtime = { path = "adapters/cel-adapter-runtime" }

# Tauri
tauri = { version = "2", features = [] }
tauri-build = { version = "2" }
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
