[package]
name = "adapter-browser"
version.workspace = true
edition.workspace = true
license = "MIT"
description = "CEL native (Rust) browser adapter — DOM perception via the cel-cdp transport"

[dependencies]
# AdapterDriver trait + manifest types come from the thin cel-adapter-sdk
# crate (not the cel-cortex engine), so this adapter no longer depends on the
# whole perception runtime. ContextElement/ContextSource come from cel-context.
cel-adapter-sdk = { workspace = true }
cel-context = { workspace = true }
cel-accessibility = { workspace = true }
cel-cdp = { workspace = true }
cel-contracts = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
