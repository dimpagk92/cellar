[package]
name = "adapter-numbers"
version.workspace = true
edition.workspace = true
license = "MIT"
description = "CEL adapter for Apple Numbers via AppleScript (macOS-only)"

[dependencies]
# AdapterDriver trait + manifest types come from the thin cel-adapter-sdk
# crate (not the cel-cortex engine). The legacy adapter-common::Adapter trait
# (used by excel/sap-gui/bloomberg/metatrader) is a separate, still-unmigrated
# surface — see docs/adapter-sdk.md.
cel-adapter-sdk = { workspace = true }
cel-contracts = { workspace = true }
cel-context = { workspace = true }
cel-accessibility = { workspace = true }
cel-input = { workspace = true }
async-trait = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
