[package]
name = "cel-accessibility"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CEL accessibility layer — UIA (Windows) and AXUIElement (macOS) bridge"

[dependencies]
tracing = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["blocking-api", "tokio"] }
tokio = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.24"
rayon = "1.10"

# macOS-only examples — gated behind a feature so cargo skips them on
# Linux. Enable via `cargo build --features macos-examples --example …`.
[features]
macos-examples = []

[[example]]
name = "dump_deep"
required-features = ["macos-examples"]

[[example]]
name = "dump_page_content"
required-features = ["macos-examples"]

[[example]]
name = "dump_text"
required-features = ["macos-examples"]
