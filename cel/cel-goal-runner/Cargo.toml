[package]
name = "cel-goal-runner"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CEL Goal Runner — full Rust execution loop"

[dependencies]
cel-context = { workspace = true }
cel-cdp = { workspace = true }
cel-cortex = { workspace = true }
# `xcap` feature turns on real screen capture. Without it create_capture()
# returns a StubCapture that produces no pixels — the canonical runner's
# screenshot_png() call then gives the planner's vision path nothing to
# look at. Must stay on wherever the runner runs live.
cel-display = { workspace = true, features = ["xcap"] }
cel-input = { workspace = true }
cel-contracts = { workspace = true }
cel-planner = { workspace = true }
cel-llm = { workspace = true }
cel-store = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
toml = "0.8"

[dev-dependencies]
cel-accessibility = { workspace = true }
cel-llm = { workspace = true }
