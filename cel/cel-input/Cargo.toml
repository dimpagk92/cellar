[package]
name = "cel-input"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CEL input layer — injection and interception of mouse/keyboard events"

[dependencies]
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
enigo = { version = "0.5", features = ["serde"] }
arboard = "3"

[target.'cfg(target_os = "macos")'.dependencies]
# Input CAPTURE (CGEventTap, listen-only) — observe system keyboard/mouse.
# Versions match cel-accessibility so they share the already-locked graph.
core-graphics = "0.24"
core-foundation = "0.10"
foreign-types = "0.5"
libc = "0.2"
