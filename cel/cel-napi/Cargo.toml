[package]
name = "cel-napi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CEL Node.js native bindings via napi-rs"

[lib]
crate-type = ["cdylib"]

[features]
xcap = ["cel-display/xcap"]

[dependencies]
cel-display = { workspace = true }
cel-input = { workspace = true }
cel-accessibility = { workspace = true }
cel-llm = { workspace = true }
cel-context = { workspace = true }
cel-network = { workspace = true }
cel-audio = { workspace = true }
cel-vision = { workspace = true }
cel-store = { workspace = true }
cel-planner = { workspace = true }
cel-cdp = { workspace = true }
cel-cortex = { workspace = true }
cel-signals = { workspace = true }
adapter-common = { workspace = true }
cel-goal-runner = { workspace = true }
cellar-worker = { path = "../../cellar-worker" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# napi-rs bindings
napi = { version = "2", features = ["async", "serde-json"] }
napi-derive = "2"

[build-dependencies]
napi-build = "2"
