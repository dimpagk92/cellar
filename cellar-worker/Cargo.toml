[package]
name = "cellar-worker"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cellar remote execution worker — HTTP daemon exposing goal execution over the worker protocol"

[lib]
name = "cellar_worker"
path = "src/lib.rs"

[[bin]]
name = "cellar-worker"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
thiserror = { workspace = true }
reqwest = { workspace = true }
axum = "0.8"

# CEL runtime — for real goal execution on the worker host.
cel-goal-runner = { workspace = true }
cel-planner = { workspace = true }
cel-llm = { workspace = true }
cel-cortex = { workspace = true }
cel-accessibility = { workspace = true }
cel-context = { workspace = true }
